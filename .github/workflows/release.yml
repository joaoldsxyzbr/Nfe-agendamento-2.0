name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          startsWith(github.event.workflow_run.head_commit.message, 'release: v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('Directory.Build.props').getroot()
          value = root.findtext('.//Version')
          if not value:
              raise SystemExit('Version ausente em Directory.Build.props')
          print(value.strip())
          PY
          )"
          expected="release: v${version}"
          actual="$(git log -1 --format=%s)"
          if [ "$actual" != "$expected" ]; then
            echo "Commit de release inválido: esperado '$expected', recebido '$actual'." >&2
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Notas de release ausentes em $notes" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Download validated installer
        uses: actions/download-artifact@v4
        with:
          name: NFeAgendamentoBridge-Setup-v${{ steps.version.outputs.version }}
          path: release/installer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated portable package
        uses: actions/download-artifact@v4
        with:
          name: NfeAgendamentoBridge-win-x64
          path: release/package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release assets
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          setup="release/installer/NFeAgendamentoBridge-Setup-v${version}.exe"
          test -s "$setup"
          test -s "release/package/NfeAgendamento.App.exe"
          test -s "release/package/NfeAgendamento.Bridge.exe"
          test -s "release/package/NfeAgendamento.Portal.exe"
          (cd release/package && zip -r "../NfeAgendamentoBridge-win-x64-v${version}.zip" .)
          test -s "release/NfeAgendamentoBridge-win-x64-v${version}.zip"

      - name: Publish GitHub release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          validated_sha="${{ github.event.workflow_run.head_sha }}"

          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$validated_sha" ]; then
              echo "Tag $tag aponta para $existing_sha, mas o CI validou $validated_sha." >&2
              exit 1
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag já existe no SHA validado; nada a publicar."
              exit 0
            fi
          fi

          gh release create "$tag" \
            "release/installer/NFeAgendamentoBridge-Setup-v${version}.exe" \
            "release/NfeAgendamentoBridge-win-x64-v${version}.zip" \
            --target "$validated_sha" \
            --title "$tag" \
            --notes-file "${{ steps.version.outputs.notes }}"
