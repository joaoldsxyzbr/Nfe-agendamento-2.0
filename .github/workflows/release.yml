name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          startsWith(github.event.workflow_run.head_commit.message, 'release: v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Resolve and validate release
        id: version
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ ! "$subject" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "Commit de release inválido: $subject" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          notes="docs/releases/v${version}.md"
          test -s "$notes"
          extension_version="$(node -p "require('./apps/extension/manifest.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "extension_version=$extension_version" >> "$GITHUB_OUTPUT"

      - name: Download validated browser extension
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: NFeAgendamento-Extension-MV3
          path: release/extension
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate extension asset
        shell: bash
        run: |
          source="release/extension/NFeAgendamento-Extension-MV3.zip"
          target="release/NFeAgendamento-Extension-v${{ steps.version.outputs.extension_version }}.zip"
          test -s "$source"
          cp "$source" "$target"

          python - "$target" "${{ steps.version.outputs.extension_version }}" <<'PY'
          from zipfile import ZipFile
          import json
          import sys

          archive_path, expected_version = sys.argv[1:]
          with ZipFile(archive_path) as archive:
              manifest = json.loads(archive.read('manifest.json'))
              if manifest.get('manifest_version') != 3:
                  raise SystemExit('Extensão publicada não é Manifest V3.')
              if manifest.get('version') != expected_version:
                  raise SystemExit('Versão da extensão divergente.')
              required = {
                  'background.js',
                  'site-bridge.js',
                  'portal-content.js',
                  'options.js',
                  'options.html',
                  'manifest.json',
              }
              missing = required.difference(archive.namelist())
              if missing:
                  raise SystemExit(f'Extensão incompleta: {sorted(missing)}')
          PY

      - name: Publish GitHub release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          validated_sha="${{ github.event.workflow_run.head_sha }}"
          extension="release/NFeAgendamento-Extension-v${{ steps.version.outputs.extension_version }}.zip"

          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$validated_sha" ]; then
              echo "Tag $tag aponta para outro SHA." >&2
              exit 1
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag já existe no SHA validado; nada a publicar."
              exit 0
            fi
          fi

          gh release create "$tag"             "$extension"             --target "$validated_sha"             --title "$tag"             --notes-file "${{ steps.version.outputs.notes }}"
