name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main' &&
          startsWith(github.event.workflow_run.head_commit.message, 'release: v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('Directory.Build.props').getroot()
          value = root.findtext('.//Version')
          if not value:
              raise SystemExit('Version ausente em Directory.Build.props')
          print(value.strip())
          PY
          )"
          expected="release: v${version}"
          actual="$(git log -1 --format=%s)"
          if [ "$actual" != "$expected" ]; then
            echo "Commit de release inválido: esperado '$expected', recebido '$actual'." >&2
            exit 1
          fi
          notes="docs/releases/v${version}.md"
          if [ ! -f "$notes" ]; then
            echo "Notas de release ausentes em $notes" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

      - name: Download validated installer
        uses: actions/download-artifact@v8
        with:
          name: NFeAgendamentoBridge-Setup-v${{ steps.version.outputs.version }}
          path: release/installer
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated portable package
        uses: actions/download-artifact@v8
        with:
          name: NfeAgendamentoBridge-win-x64
          path: release/package
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate release assets
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          setup="release/installer/NFeAgendamentoBridge-Setup-v${version}.exe"
          package="release/NfeAgendamentoBridge-win-x64-v${version}.zip"
          test -s "$setup"
          test -s "release/package/NfeAgendamento.App.exe"
          test -s "release/package/NfeAgendamento.Bridge.exe"
          test -s "release/package/NfeAgendamento.Portal.exe"

          python - "$version" <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import sys

          version = sys.argv[1]
          root = Path('release/package')
          output = Path(f'release/NfeAgendamentoBridge-win-x64-v{version}.zip')
          files = sorted(path for path in root.rglob('*') if path.is_file())
          if not files:
              raise SystemExit('Pacote Windows validado está vazio.')

          with ZipFile(output, 'w', compression=ZIP_DEFLATED, compresslevel=9) as archive:
              for path in files:
                  info = ZipInfo(path.relative_to(root).as_posix(), date_time=(1980, 1, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.create_system = 3
                  info.external_attr = (0o644 & 0xFFFF) << 16
                  archive.writestr(info, path.read_bytes(), compress_type=ZIP_DEFLATED, compresslevel=9)
          PY

          test -s "$package"

      - name: Publish GitHub release if absent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          validated_sha="${{ github.event.workflow_run.head_sha }}"
          setup="release/installer/NFeAgendamentoBridge-Setup-v${version}.exe"
          package="release/NfeAgendamentoBridge-win-x64-v${version}.zip"

          verify_release_asset() {
            local asset_name="$1"
            local local_path="$2"
            local metadata
            metadata="$(python - "$release_json" "$asset_name" <<'PY'
          import json
          import sys

          release_path, asset_name = sys.argv[1:]
          with open(release_path, encoding='utf-8') as handle:
              release = json.load(handle)
          matches = [asset for asset in release.get('assets', []) if asset.get('name') == asset_name]
          if len(matches) != 1:
              raise SystemExit(f'Asset {asset_name!r} ausente ou duplicado na release existente.')
          asset = matches[0]
          if asset.get('state') != 'uploaded':
              raise SystemExit(f'Asset {asset_name!r} não está no estado uploaded.')
          size = asset.get('size')
          digest = asset.get('digest') or ''
          if not isinstance(size, int) or size <= 0 or not digest.startswith('sha256:'):
              raise SystemExit(f'Metadados de integridade inválidos para {asset_name!r}.')
          print(f'{size}\t{digest}')
          PY
          )"

            local remote_size remote_digest local_size local_digest
            IFS=$'\t' read -r remote_size remote_digest <<< "$metadata"
            local_size="$(stat -c%s "$local_path")"
            local_digest="sha256:$(sha256sum "$local_path" | awk '{print $1}')"

            if [ "$remote_size" != "$local_size" ] || [ "$remote_digest" != "$local_digest" ]; then
              echo "Asset $asset_name da release existente diverge do artifact validado pelo CI." >&2
              echo "Remoto: size=$remote_size digest=$remote_digest" >&2
              echo "Local:  size=$local_size digest=$local_digest" >&2
              exit 1
            fi
          }

          if existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/$tag" --jq '.sha' 2>/dev/null)"; then
            if [ "$existing_sha" != "$validated_sha" ]; then
              echo "Tag $tag aponta para $existing_sha, mas o CI validou $validated_sha." >&2
              exit 1
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              release_json="$(mktemp)"
              trap 'rm -f "$release_json"' EXIT
              gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" > "$release_json"
              verify_release_asset "$(basename "$setup")" "$setup"
              verify_release_asset "$(basename "$package")" "$package"
              echo "Release $tag já existe no SHA validado e os assets conferem; nada a publicar."
              exit 0
            fi
          fi

          gh release create "$tag" \
            "$setup" \
            "$package" \
            --target "$validated_sha" \
            --title "$tag" \
            --notes-file "${{ steps.version.outputs.notes }}"
