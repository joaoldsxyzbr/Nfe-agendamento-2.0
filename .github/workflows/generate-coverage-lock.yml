name: Generate coverage lock diff

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-coverage-lock.yml'

permissions:
  contents: read

jobs:
  diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
      - name: Generate deterministic lockfile diff
        run: |
          npm install --package-lock-only --ignore-scripts --workspace @nfe-agendamento/web --save-dev @vitest/coverage-v8@5.0.0
          git diff -- apps/web/package.json package-lock.json
