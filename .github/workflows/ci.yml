name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint:ui
      - run: npm run format:check:ui
      - run: npm run test:ui
      - run: npm run coverage:ui
      - run: npm run build:ui

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test:extension
      - run: npm run coverage:extension
      - run: npm run build:extension
      - name: Validar pacote local autonomo
        run: |
          test -s apps/extension/dist/app.html
          test -s apps/extension/dist/src/main.js
          test -s apps/extension/dist/src/portal/extension-client.js
          test -s apps/extension/dist/brand-mark.png
          node -e 'const m=require("./apps/extension/dist/manifest.json"); if(m.host_permissions.some(x=>x.includes("joaolds.xyz.br"))) process.exit(1)'
      - name: Publicar pacote para teste manual (somente artifact)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: NFeAgendamento-Piloto-v0.3.0
          path: apps/extension/dist/
          if-no-files-found: error
          retention-days: 7

  danfe-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/playwright
      - run: npm audit --prefix tests/playwright --audit-level=high
      - run: tests/playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate and validate browser/DANFE flows
        run: npm test --prefix tests/playwright