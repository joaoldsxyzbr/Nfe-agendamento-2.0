name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint:web
      - run: npm run format:check:web
      - run: npm run test:web
      - run: npm run coverage:web
      - run: npm run build:web
      - run: ./node_modules/.bin/wrangler deploy --dry-run

  extension:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:extension
      - run: npm run build:extension
      - name: Package unpacked Chromium extension
        run: |
          mkdir -p artifacts
          cd apps/extension/dist
          zip -r ../../../artifacts/NFeAgendamento-Extension-MV3.zip .
      - name: Upload Chromium extension
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: NFeAgendamento-Extension-MV3
          path: artifacts/NFeAgendamento-Extension-MV3.zip
          if-no-files-found: error
          retention-days: 14

  danfe-print:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/playwright/package-lock.json
      - run: npm ci
      - run: npm ci --prefix tests/playwright
      - run: npm audit --prefix tests/playwright --audit-level=high
      - run: tests/playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Generate and validate browser/DANFE flows
        run: npm test --prefix tests/playwright
      - name: Upload DANFE print regression artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: danfe-print-regression
          path: tests/playwright/test-results
          if-no-files-found: warn
          retention-days: 7
