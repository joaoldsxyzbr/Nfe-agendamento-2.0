name: Refresh Portal NuGet lock

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/refresh-portal-lock.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Regenerate Portal lockfile for win-x64
        shell: pwsh
        run: |
          dotnet restore apps/bridge/windows/NfeAgendamento.Portal/NfeAgendamento.Portal.csproj `
            -r win-x64 `
            --force-evaluate `
            -p:RestoreLockedMode=false `
            -p:RestorePackagesWithLockFile=true

          $lock = "apps/bridge/windows/NfeAgendamento.Portal/packages.lock.json"
          if (-not (Select-String -Path $lock -Pattern 'win-x64' -Quiet)) {
            throw "Lockfile regenerado sem o runtime win-x64."
          }
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: portal-nuget-lock
          path: apps/bridge/windows/NfeAgendamento.Portal/packages.lock.json
          if-no-files-found: error
