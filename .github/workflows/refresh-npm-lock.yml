name: Refresh npm lock

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Regenerate package-lock from package manifests
        shell: bash
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts
      - name: Verify secure sharp resolution
        run: node -e "const lock=require('./package-lock.json'); const v=lock.packages?.['node_modules/sharp']?.version; if(v!=='0.35.4'){throw new Error('sharp esperado 0.35.4, encontrado '+v)}"
      - name: Verify npm audit
        run: npm audit --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: atualizar lockfile para sharp seguro"
          git push
