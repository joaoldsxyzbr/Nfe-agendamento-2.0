name: Release v0.0.5

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Check release marker
        id: gate
        shell: bash
        run: |
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" == "release: v0.0.5" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download validated Windows installer
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: NFeAgendamentoBridge-Setup-v0.0.5
          path: release-installer
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download validated Windows package
        if: steps.gate.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: NfeAgendamentoBridge-win-x64
          path: release-package
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create technical fallback archive
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          cd release-package
          zip -r ../NfeAgendamentoBridge-win-x64.zip .

      - name: Verify release assets
        if: steps.gate.outputs.publish == 'true'
        shell: bash
        run: |
          test -f release-installer/NFeAgendamentoBridge-Setup-v0.0.5.exe
          test -f NfeAgendamentoBridge-win-x64.zip

      - name: Publish GitHub Release
        if: steps.gate.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          if gh release view v0.0.5 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v0.0.5 já existe; nenhuma duplicação será criada."
            exit 0
          fi

          gh release create v0.0.5 \
            release-installer/NFeAgendamentoBridge-Setup-v0.0.5.exe \
            NfeAgendamentoBridge-win-x64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "NFe Agendamento 2.0 v0.0.5" \
            --notes-file docs/releases/v0.0.5.md
