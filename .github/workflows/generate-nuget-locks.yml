name: Generate NuGet lockfiles

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/generate-nuget-locks.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Generate lockfiles
        shell: pwsh
        run: |
          dotnet restore apps/bridge/tests/NfeAgendamento.Bridge.Tests/NfeAgendamento.Bridge.Tests.csproj --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet restore apps/bridge/windows/NfeAgendamento.Portal/NfeAgendamento.Portal.csproj --force-evaluate
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated lockfiles
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/bridge/tests/NfeAgendamento.Bridge.Tests/packages.lock.json apps/bridge/windows/NfeAgendamento.Portal/packages.lock.json
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Lockfiles já estavam atualizados."
            exit 0
          }
          git commit -m "build: fixar dependências NuGet"
          git push origin HEAD:main
