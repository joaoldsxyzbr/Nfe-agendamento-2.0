version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/tests/playwright"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: nuget
    directories:
      - "/apps/bridge/windows/NfeAgendamento.Portal"
      - "/apps/bridge/tests/NfeAgendamento.Bridge.Tests"
      - "/tests/unimake-poc"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
