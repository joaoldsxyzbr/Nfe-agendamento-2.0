<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFe Agendamento - Certificado A1</title>
  <style>
    :root { font-family: Arial, Helvetica, sans-serif; color-scheme: light dark; }
    body { margin: 0; padding: 24px; min-width: 420px; }
    main { display: grid; gap: 12px; }
    h1 { margin: 0; font-size: 21px; }
    p { margin: 0; line-height: 1.5; }
    .hint { opacity: .78; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Autenticando certificado A1</h1>
    <p id="direct-lookup-status" role="status" aria-live="polite">Preparando conexão segura…</p>
    <p class="hint">O certificado e a chave privada continuam no Windows. Esta janela existe para permitir que o Chrome/Edge use o A1 durante a autenticação TLS com a SEFAZ.</p>
  </main>
  <script src="direct-lookup-page.js"></script>
</body>
</html>
