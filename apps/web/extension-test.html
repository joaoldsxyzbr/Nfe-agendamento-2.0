<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>NFe Agendamento - Teste sem Bridge</title>
    <style>
      :root { font-family: Arial, Helvetica, sans-serif; color: #172033; background: #f5f7fb; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px 20px; }
      main { width: min(760px, 100%); margin: 0 auto; display: grid; gap: 18px; }
      section { background: white; border: 1px solid #d9deea; border-radius: 14px; padding: 22px; }
      h1 { margin: 0; font-size: 26px; }
      p { line-height: 1.5; }
      label { display: block; margin-bottom: 8px; font-weight: 700; }
      .row { display: flex; gap: 10px; }
      input { min-width: 0; flex: 1; padding: 11px 12px; font: inherit; }
      button { padding: 11px 18px; font: inherit; font-weight: 700; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      #extension-smoke-status, #extension-smoke-extension { font-weight: 700; }
      .warning { border-left: 4px solid currentColor; padding-left: 12px; }
    </style>
  </head>
  <body>
    <main>
      <section>
        <h1>Teste site + extensão, sem Bridge</h1>
        <p class="warning">Mantenha o Bridge totalmente parado ou desinstalado. O hCaptcha continua manual.</p>
        <p id="extension-smoke-extension" role="status">Verificando extensão…</p>
      </section>

      <section>
        <label for="extension-smoke-key">Chave da NF-e</label>
        <div class="row">
          <input
            id="extension-smoke-key"
            inputmode="numeric"
            autocomplete="off"
            maxlength="44"
            placeholder="Digite ou cole a chave de acesso"
          />
          <button id="extension-smoke-run" type="button" disabled>Testar consulta sem Bridge</button>
        </div>
        <p id="extension-smoke-status" role="status" aria-live="polite">Aguardando teste.</p>
      </section>
    </main>

    <script type="module" src="/src/extension-only-smoke.ts"></script>
  </body>
</html>
